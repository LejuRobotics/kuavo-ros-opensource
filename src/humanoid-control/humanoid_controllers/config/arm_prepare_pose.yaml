# 自定义双臂位姿。仅当 launch 入参 use_custom_arm_prepare:=true 时生效。
# true: 电机初始化的 moveToZero 直接去 joint_pos，准备阶段也停在这里。
# false: 电机先回零，准备阶段走控制器里原来的写死臂姿。
# 顺序：左臂 zarm_l1..l7，右臂 zarm_r1..r7，单位 rad。
# 下标 0/7 肩 l1/r1，3/10 肘 l4/r4，4/11 是现有往返摆动的 l5/r5。
# 当前为肩 -30°、肘 -60°，其余为 0。按需再改。
joint_pos: [-0.5236, 0.0, 0.0, -1.0471, 0.0, 0.0, 0.0,
            -0.5236, 0.0, 0.0, -1.0471, 0.0, 0.0, 0.0]

# 单臂内的关节下标，左右同时摆。4 = zarm_l5/r5（原逻辑）；3 = 肘 zarm_l4/r4。
swing_joint_index: 4
# 左臂该关节在中点的偏移（rad），右臂取相反数。
swing_rad: 0.5236
# 往返总时间（秒）：起点 -> 中点 -> 回到起点。
duration: 1.5
