# RL控制器列表配置文件
# 定义该版本机器人需要加载的RL控制器
# class: 控制器大类，可选值：BASE_CONTROLLER, FALL_STAND_CONTROLLER
# type: 具体控制器类型，可选值：MPC, AMP_CONTROLLER, FALL_STAND_CONTROLLER, VMP_CONTROLLER

controllers:
  - name: "amp_controller"
    class: "BASE_CONTROLLER"  # 基础行走控制器
    type: "AMP_CONTROLLER"    # 具体控制器类型
    config_file: "rl/skw_rl_param.info" 
    enabled: false
    
  - name: "amp_craic_controller"
    class: "BASE_CONTROLLER"  # 基础行走控制器
    type: "AMP_CONTROLLER"    # 具体控制器类型
    config_file: "rl/skw_rl_param_craic.info"
    enabled: false

  - name: "vmp_controller"
    class: "BASE_CONTROLLER"  # VMP控制器
    type: "VMP_CONTROLLER"    # VMP控制器类型
    config_file: "vmp/vmp_param.info"  # VMP配置文件路径
    enabled: true  # 默认不启用，需要时设为true

