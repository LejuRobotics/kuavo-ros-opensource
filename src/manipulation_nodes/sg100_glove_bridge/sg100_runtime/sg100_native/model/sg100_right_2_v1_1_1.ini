[sdk]
official_name = "SG100"
side = "right"
version = "1_1_1"

[model]
urdf_path = "right_sg100.urdf"

[input]
position_length = 15
orientation_length = 20
position_unit = "m"
orientation_order = "wxyz"
finger_order = ["thumb", "index", "middle", "ring", "pinky"]

[output]
joint_count = 11
layout = "mujoco_qpos"
joint_order = ["thumb_j1", "thumb_j2", "thumb_j3", "index_j1", "index_j2", "index_j3", "middle_j1", "middle_j2", "little_j1", "little_j2", "little_j3"]

[solver]
max_iters = 30
step_eta = 1.0
damping_lambda0 = 0.001
pos_tol = 0.0001
max_step = 0.35
bounds_eps = 0.0001
posture_weight = 0.0
smooth_weight = 0.0
tip_reference_world_wxyz = [0.7071067811865476, 0.0, 0.0, -0.7071067811865476]

[solver.tip_reference_world_wxyz_per_finger]
thumb = [0.0, 0.27563735581699916, 0.0, 0.9612616959383189]

[solver.finger_weights.thumb]
pos = 1.0
rot = 0.04

[solver.finger_weights.index]
pos = 1.0
rot = 0.04

[solver.finger_weights.middle]
pos = 1.0
rot = 0.04

[solver.finger_weights.little]
pos = 1.0
rot = 0.04

[solver.mcp_aa_direct]
enabled = false

[solver.side_orientation_ik]
enabled = true
fingers = ["index", "little"]
max_abs_angle_deg = 30.0
coarse_samples = 25
refine_iterations = 12

[solver.side_orientation_ik.output_gain]
index = 1.0
little = 1.0

[solver.root_flexion_weight]
enabled = true

[solver.root_flexion_weight.side]
start_deg = 0.0
end_deg = 120.0
min_weight = 0.2

[solver.root_flexion_weight.terminal]
start_deg = 0.0
end_deg = 120.0
min_weight = 1.0

[solver.four_finger_flexion_orientation_ik]
enabled = true
skip_initial_position_ik = false
fingers = ["index", "middle", "little"]
coarse_samples = 21
refine_iterations = 10
position_refit_iterations = 8
position_refit_step_eta = 1.0
position_refit_damping = 0.001
position_refit_max_step = 0.2

[solver.four_finger_flexion_orientation_ik.terminal_joint]
index = "index_j3"
middle = "middle_j2"
little = "little_j3"

[solver.four_finger_flexion_orientation_ik.side_joint]
index = "index_j1"
little = "little_j1"

[solver.four_finger_flexion_orientation_ik.output_gain]
index = 1.0
middle = 1.0
little = 1.0

[target_state_filter]
enabled = true
static_enter_threshold_m = 0.00096
static_exit_threshold_m = 0.00192
static_residual_threshold_m = 0.00144
static_speed_threshold_mps = 0.012
static_enter_frames = 5
alpha_static = 0.12
beta_static = 0.001
alpha_moving = 0.70
beta_moving = 0.25
max_velocity_mps = 0.5
reset_on_invalid = true

[q_output_guard]
enabled = true
static_deadband_rad = 0.002
static_max_dq_rad = 0.004

[input_transform]
swap_xz = true
negate_raw_z = false
raw_xyz_offset_m = [0.0, 0.0, 0.04]
axis_order = null
axis_sign = [1.0, 1.0, 1.0]
apply_init_rotation = true
apply_finger_init_rotation = false
apply_finger_y90_init_rotation = true
swap_yz_relative_rotation = false
swap_xz_relative_rotation = true
swap_xy_relative_rotation_all = true
swap_xy_relative_rotation = false
flip_relative_rotation = false
thumb_flip_xy_only = false
use_orientation = true
negate_x_before_ik = false
max_reach_m = 0.5
scale_before_offset = true
offset_xyz = [0.04, 0.01, 0.1]
scale = 1.0

[input_transform.module_to_tip]
enabled = true
offset_is_module_from_tip = false
default_offset_local_xyz = [0.0, 0.0, 0.0]
default_rpy_local = [0.0, 0.0, 0.0]

[input_transform.module_to_tip.per_finger_offset_local_xyz]
thumb = [0.0, 0.0, 0.01]
index = [0.005, 0.0, 0.01]
middle = [0.015, 0.0, 0.01]
ring = [0.015, 0.0, 0.01]
pinky = [0.015, 0.0, 0.01]

[input_transform.per_finger_offset_xyz]
thumb = [0.00, -0.1150, 0.000]
index = [-0.0, 0.015, -0.015]
middle = [0.0, -0.01, -0.01]
ring = [-0.0, -0.035, -0.01]
pinky = [0.01, -0.037, -0.03]

[input_transform.per_finger_scale]
thumb = [1.23, 4.4, 1.5]
index = [1.45, 0.2, 1.45]
middle = [1.45, 0.2, 1.3]
ring = [1.45, 0.2, 1.45]
pinky = [1.5, 0.2, 1.9]

[root]
sg100_input_indices = [0, 1, 2, 3]
orientation_anchor_quat_wxyz = [1.0, 0.0, 0.0, 0.0]
mcp_aa_anchor_wxyz = [0.7071067811865476, 0.0, 0.0, -0.7071067811865476]
little_force_zero = false

