# ============================================================
# 随机化配置
# ============================================================
randomization:
  # 可随机交换位置的零件组
  # 基于 objects 中的默认位置，shuffle 打乱 + ±offset 微偏移
  shuffleable_parts:
    names:
      - steel_pipe_fasteners_1
      - steel_pipe_fasteners_2
      - steel_pipe_fasteners_3
      - t_junction_1
      - t_junction_2
      - t_junction_3
    xy_offset: 0.02       # X/Y 方向 ±2cm 随机偏移

  # 范围随机物体（每次 seed 生成不同位置，保证最小间距）
  random_objects:
    traffic_cones:
      names:
        - traffic_cone_1
        - traffic_cone_2
        - traffic_cone_3
        - traffic_cone_4
        - traffic_cone_5
        - traffic_cone_6
      x_min: -3.0
      x_max: 3.0
      y_min: 1.8
      y_max: 4.2
      z: 0.0
      min_distance: 1.0        # 锥之间最小间距（米），避免扎堆

  # 位置预设（料盘位置）
  # 料盘架参数：pos="-0.25 -2.0 0"，架板宽1.2m（X方向±0.6），两层有围栏
  # 围栏杆世界X：0.25, 0.15, 0.05, -0.05, -0.15, -0.25, -0.35, -0.45, -0.55, -0.65, -0.75
  # 可用X槽位（杆间中点）：0.20, 0.10, 0.00, -0.10, -0.20, -0.30, -0.40, -0.50, -0.60, -0.70
  # 下层 Z=0.75，上层 Z=1.15，Y固定-1.933
  # 每套保证：下层2个 + 上层3个
  presets:
    # ---- preset 0：下层靠右，上层居中偏左 ----
    - tray_1: {pos: "0.10 -1.933 0.75"}
      tray_2: {pos: "-0.10 -1.933 0.75"}
      tray_3: {pos: "-0.20 -1.933 1.15"}
      tray_4: {pos: "0.00 -1.933 1.15"}
      tray_5: {pos: "-0.40 -1.933 1.15"}

    # ---- preset 1：下层靠左，上层靠右 ----
    - tray_1: {pos: "-0.40 -1.933 0.75"}
      tray_2: {pos: "-0.60 -1.933 0.75"}
      tray_3: {pos: "0.10 -1.933 1.15"}
      tray_4: {pos: "0.00 -1.933 1.15"}
      tray_5: {pos: "-0.20 -1.933 1.15"}

    # ---- preset 2：下层两端，上层均匀分布 ----
    - tray_1: {pos: "0.10 -1.933 0.75"}
      tray_2: {pos: "-0.60 -1.933 0.75"}
      tray_3: {pos: "-0.40 -1.933 1.15"}
      tray_4: {pos: "-0.20 -1.933 1.15"}
      tray_5: {pos: "0.00 -1.933 1.15"}

    # ---- preset 3：下层居中，上层两端+中间 ----
    - tray_1: {pos: "-0.20 -1.933 0.75"}
      tray_2: {pos: "0.00 -1.933 0.75"}
      tray_3: {pos: "0.10 -1.933 1.15"}
      tray_4: {pos: "-0.30 -1.933 1.15"}
      tray_5: {pos: "-0.60 -1.933 1.15"}

  # 按钮亮暗随机化（每根立柱上随机亮一个按钮）
  button_groups:
    - [button_1_green, button_1_red]    # 立柱1：随机亮绿或红
    - [button_2_green, button_2_red]    # 立柱2：随机亮绿或红
