# CRAIC 机器人仿真场景配置
# U型走廊场景：外围矩形房间 + 内部矩形障碍物 = U型走廊
scene_name: "CRAIC Lab Scene"

# 相机视角设置
camera:
  center: "4 1 3"      # 相机焦点位置 (x, y, z)
  extent: "5"          # 视野范围（数值越小，视角越近）

visual:
  headlight:
    diffuse: "0.45 0.45 0.45"
    ambient: "0.25 0.25 0.25"
    specular: "0 0 0"
  haze: "0.15 0.25 0.35 1"
  azimuth: 160
  elevation: -20

materials:
  ground_mat:
    texture_file: "marble_tile.png"  # 深灰大理石纹理贴图（放在 xml 目录下）
    texrepeat: "50 50"
    texuniform: "false"
    reflectance: 0.02
    shininess: 0.05
    rgba: "0.75 0.73 0.70 1"
  walls_mat:
    rgba: "0.85 0.75 0.60 1"    # 浅棕色墙壁
    reflectance: 0.05            # 降低反射
    shininess: 0.05              # 降低光泽
  inner_wall_mat:
    rgba: "0.78 0.68 0.53 1"    # 深一点的棕色（内墙）
    reflectance: 0.05            # 降低反射
    shininess: 0.05              # 降低光泽
    # texture_file: "models/wall_textures/wall.png"   # 内墙贴图，可单独指定

ground:
  enabled: true
  size: "50 50 0.05"            # 有限平面，配合 texrepeat 控制格子大小
  rgba: "0.75 0.73 0.70 1"     # 深灰底色
  material: "ground_mat"

lights:
  - name: "main_light"
    pos: "0 0 10"
    dir: "0 0 -1"
    directional: "true"
    diffuse: "0.6 0.6 0.6"          # 白光
    specular: "0 0 0"               # 无高光

# U型走廊设计：
# - 外围房间：12.46m x 9m
# - 内部U型：三面独立的墙（上墙、下墙、右墙），左侧开口
# 每面墙可单独贴图（一墙一图，等比例铺满）：
#   texture_file: 单面墙用
#   texture_files: [path1, path2, ...] 多面墙，与 points 边顺序对应
rooms:
  # 外围大房间
  outer_room:
    points:
      - [6.25, 4.5]     # 右上角
      - [-6.25, 4.5]    # 左上角
      - [-6.25, -4.5]   # 左下角
      - [6.25, -4.5]    # 右下角
    height: 1.0
    wall_thickness: 0.05
    material: "walls_mat"
    # 每面墙一张图，按墙顺序：上|左|下|右，交叉分配不重复
    texture_files:
      - "models/wall_textures/1.png"
      - "models/wall_textures/1.png"
      - "models/wall_textures/1.png"
      - "models/wall_textures/1.png"
  
  # 内部U型 - 上墙（横墙）
  inner_top_wall:
    points:
      - [-3.25, 1.5]       # 右端
      - [3.25, 1.5]      # 左端
    height: 1.0
    wall_thickness: 0.05
    material: "inner_wall_mat"
    # texture_file: "models/wall_textures/inner_top.png"  # 单面墙贴图，图片与墙 6.5m×1m 等比例
  # 内部U型 - 下墙（横墙）
  inner_bottom_wall:
    points:
      - [5.25, -2.5]      # 右端
      - [-3.25, -2.5]     # 左端
    height: 1.0
    wall_thickness: 0.05
    material: "inner_wall_mat"
  
  # 内部U型 - 右墙（竖墙）
  inner_right_wall:
    points:
      - [-3.25, -2.5]       # 上端
      - [-3.25, 1.5]      # 下端
    height: 1.0
    wall_thickness: 0.05
    material: "inner_wall_mat"

# 场景物体（暂时为空）
objects:
  # 地面彩色标记示例
  - type: "floor_marker"
    name: "end_point"
    points:
      - [5.25, -2.5]      # 右上角
      - [6.25, -2.5]     # 左上角
      - [6.25, -4.5]    # 左下角
      - [5.25, -4.5]     # 右下角
    rgba: "0.45 0.35 0.2 1"    # 棕色不透明
    z_offset: 0.002      # 略高于地面
    border_rgba: "1 1 1 0.8"   # 白色边线
    border_width: 0.04         # 边线宽度 4cm
  - type: "floor_marker"
    name: "pause_point"
    points:
      - [6.25, -2.5]      # 右上角
      - [3.25, -2.5]     # 左上角
      - [3.25, 1.5]    # 左下角
      - [6.25, 1.5]     # 右下角
    rgba: "0.45 0.35 0.2 1"    # 棕色不透明
    z_offset: 0.002      # 略高于地面
    border_rgba: "1 1 1 0.8"   # 白色边线
    border_width: 0.04         # 边线宽度 4cm
  - type: "floor_marker"
    name: "start_point1"
    points:
      - [6.25, 4.5]      # 右上角
      - [3.25, 4.5]     # 左上角
      - [3.25, 1.5]    # 左下角
      - [6.25, 1.5]     # 右下角
    rgba: "0.45 0.35 0.2 1"    # 棕色不透明
    z_offset: 0.002      # 略高于地面
    border_rgba: "1 1 1 0.8"   # 白色边线
    border_width: 0.04         # 边线宽度 4cm
  - type: "floor_marker"
    name: "start_point2"
    points:
      - [2.75, -1.5]      # 右上角
      - [1.25, -1.5]     # 左上角
      - [1.25, 0.5]    # 左下角
      - [2.75, 0.5]     # 右下角
    rgba: "0.45 0.35 0.2 1"    # 棕色不透明
