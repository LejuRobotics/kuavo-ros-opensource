    border_rgba: "1 1 1 0.8"   # 白色边线
    border_width: 0.04         # 边线宽度 4cm
  
  # 托盘（使用真实扫描模型）
  # 立在架子第一层上
  # 料盘X位置说明：
  # 围栏杆世界X坐标（每0.1m一根）：0.25, 0.15, 0.05, -0.05, ..., -0.75
  # 料盘应放在两根杆之间（偏移0.05m）：0.20, 0.10, 0.00, -0.10, -0.20, -0.30, ...
  - type: "include"
    name: "tray_1"
    file: "/root/kuavo_ws/src/craic_simulator/models/charging_tray/model.xml"
    pos: "-0.10 -1.933 0.75"        # 第一层架板上
    euler: "0 1.5708 0"           # 绕Y轴旋转90度，让托盘竖立
    target_size: "0.2 0.03"       # 目标尺寸：直径0.2m，高0.03m
    rgba: "0.1 0.1 0.1 1"         # 黑色
    movable: true                 # 是否可移动/可抓取
    mass: 0.05                     # 质量（kg），影响物理仿真
    friction: "3.0 2.2 0.03"      # 摩擦系数（滑移/扭转/滚动），大幅增大便于抓取
    condim: "6"
    solref: "0.005 1.5"
    solimp: "0.98 0.995 0.0001"

