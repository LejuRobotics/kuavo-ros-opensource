# 动捕刚体配置：名称、工装偏移
# =============================
# mocap_source 指定动捕源，脚本据此自动解析 topic（无需手动改每个话题）：
#   motive   -> /checkerboard_pose、/torso_pose、/l_shoulder_pose（OptiTrack/Nokov 桥）
#   qingtong -> /vrpn_client_node/<name>/pose（vrpn_client_ros）
# 无参启动默认 Motive；青瞳现场请在 start_record.sh 中显式传 qingtong。
#
# link_offset_mm：工装原点在对应 link 坐标系下的位置 (mm)；处理时从动捕位姿反推 link 位姿

mocap_source: motive

# 左肩工装按机型固定；process_mocap_poses.py 通过 --robot-version 选择。
left_shoulder_fixtures:
  default: [0.0, -53.5, 105.0]
  s45: [0.0, -68.5, 105.0]

bodies:
  - name: checkerboard
    msg_type: PoseStamped
    link_offset_mm: [-203.93, -153.93, 11.50]
  - name: torso
    msg_type: PoseStamped
    link_offset_mm: [120.02, -50.82, 6.0]
  - name: l_shoulder
    msg_type: PoseStamped
    link_offset_mm: [0.0, -53.50, 105.00]

  # - name: l_hand
  #   msg_type: PoseStamped
  #   link_offset_mm: [0.0, -0.50, 55.4]  # z = 170 - 114.6=55.4
  # - name: r_hand
  #   msg_type: PoseStamped
  #   link_offset_mm: [0.0, 0.50, 55.4]

# 相对位姿计算：child 在 parent 坐标系下的位姿（基于 link 位姿，非工装刚体）
relative_pairs:
  - child: checkerboard
    parent: l_shoulder
  - child: checkerboard
    parent: torso
