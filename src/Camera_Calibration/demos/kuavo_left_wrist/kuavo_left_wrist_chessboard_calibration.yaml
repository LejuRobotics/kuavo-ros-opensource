# Kuavo 左手腕：固定棋盘与相机 URDF，仅标定左臂 7 关节零位（不标定相机外参）

base_link: zarm_l1_ref_link
verbose: true

models:
  - name: left_wrist_camera_to_base
    type: chain
    frame: left_wrist_camera_color_optical_frame
  - name: tag_to_base
    type: chain
    frame: checkerboard_link

free_params:
  - zarm_l1_joint
  - zarm_l2_joint
  - zarm_l3_joint
  - zarm_l4_joint
  - zarm_l5_joint
  - zarm_l6_joint
  - zarm_l7_joint

# 小幅放开腕部相机安装 6DOF（与头部 camera_base 做法一致），棋盘几何不动。
# 用较大 outrageous 正则把平移漂移压在 <1cm、旋转 <0.01rad。
free_frames:
  - name: l_hand_camera_joint
    x: true
    y: true
    z: true
    roll: true
    pitch: true
    yaw: true

error_blocks:
  - name: board_align
    type: chain3d_to_chain3d
    model_a: left_wrist_camera_to_base
    model_b: tag_to_base
    center_weight: 1.0
    corner_pose_weight: 0.35
    enable_corner_filter: true
    grid_edge_length_m: 0.03
    min_edge_ratio: 0.6
    max_edge_ratio: 1.4

  - name: restrict_l_hand_camera_joint
    type: outrageous
    param: l_hand_camera_joint
    joint_scale: 0.0
    position_scale: 0.8
    rotation_scale: 0.8
