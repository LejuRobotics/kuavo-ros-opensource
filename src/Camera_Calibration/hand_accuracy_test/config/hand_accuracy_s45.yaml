# 末端 l_hand / r_hand 动捕精度测试配置（s45 / 4pro）
# ==================================================
# 与 hand_accuracy.yaml 相同，但适配 s45：
#   - s45 无腰：TF parent_frame 用 base_link（不是 waist_yaw_link）
#   - robot_layout: biped45

teach:
  left_json: ../teach_capture_output/teach_left_joint_test.json
  right_json: ../teach_capture_output/teach_right_joint_test.json
  skip_first_last: true

# 手臂末程工装：默认 legacy，可通过 --fixture 选 new。
fixtures:
  legacy:
    l_hand: [-3.0, -0.5, -120.0]
    r_hand: [-3.0, 0.5, -120.0]
  new:
    l_hand: [-3.0, 68.0, -95.0]
    r_hand: [-3.0, -68.0, -95.0]

# Motive 刚体话题（OptiTrack: PoseStamped；Nokov 可能为 Pose）
# link_offset_mm：URDF link 系 [x,y,z] (mm)
mocap_bodies:
  - name: l_hand
    topic: /l_hand_pose
    msg_type: PoseStamped
    link_offset_mm: [-3.0, -0.5, -120]  # legacy 工装
  - name: r_hand
    topic: /r_hand_pose
    msg_type: PoseStamped
    link_offset_mm: [-3.0, 0.5, -120]
  - name: torso
    topic: /torso_pose
    msg_type: PoseStamped
    link_offset_mm: [120.02, -50.82, 6.0]   # 两套手腕工装共用，base_link 系

# 第二套动捕（青瞳 vrpn_client_node）——用于交叉验证。可选：不配则只采第一套。
# 与 mocap_bodies 结构一致；align 用 mocap_bodies_alt_align（青瞳 torso 轴，初始 [1,1,1] 待实测）
mocap_bodies_alt:
  - name: l_hand
    topic: /vrpn_client_node/l_hand/pose
    msg_type: PoseStamped
    link_offset_mm: [-3.0, -0.5, -120]
  - name: r_hand
    topic: /vrpn_client_node/r_hand/pose
    msg_type: PoseStamped
    link_offset_mm: [-3.0, 0.5, -120]
  - name: torso
    topic: /vrpn_client_node/torso/pose
    msg_type: PoseStamped
    link_offset_mm: [120.02, -50.82, 6.0]
mocap_bodies_alt_align:
  enabled: true
  axis_flip: [1, 1, 1]

# Motive torso 刚体系 → URDF base_link 系（对比 TF 前施加）
mocap_frame_align:
  enabled: true
  axis_flip: [1, 1, 1]

# TF：torso 动捕 link 对应 base_link（s45 无腰）
tf:
  parent_frame: base_link
  left_child_frame: zarm_l7_link
  right_child_frame: zarm_r7_link
  lookup_timeout_sec: 2.0

# 双臂下发（s45）
robot:
  robot_layout: biped45
  sensor_topic: /sensors_data_raw
  arm_traj_topic: /kuavo_arm_traj
  left_start_index: 12
  right_start_index: 19
  dt: 0.01
  move_duration: 2.0
  hold_sec: 3.0
  mocap_collect_sec: 1.0
  startup_align_sec: 2.0
  return_to_zero_sec: 2.0
  wait_sensors_timeout: 30.0
  set_external_control_mode: true
  enable_arm_quick_mode: true
  enable_arm_traj_interpolator: true

# 动捕滤波与报告
processing:
  sigma: 3.0
  warn_threshold_mm: 5.0

output:
  json_path: ""
  csv_path: ""
