    x_bar_knee: -0.03
    z_bar_knee: -0.1405
    # l_tendon = |tendon_site - tendon_hinge| in tendon body = √(0.00183425² + 0.14168803²)
    l_tendon: 0.14170027184066055
    # l_bar_td = |tendon_hinge - l_knee_bar axis| = √(0.013781² + 0.038083²)
    l_bar_td: 0.04049980759181829
    # l_knee_eq = |eq anchor - l_knee axis| = √(0.01438475² + 0.03689497²)
    l_knee_eq: 0.039600042434343826
