version: 1

# 顶层索引：外部版本字符串 →（按模块拆分的）token/配置入口
#
# 说明：
# - 外部版本字符串是 CLI/上层系统看到的（例如 5gen2、7gen、s70、56/70 等）。
# - 同一个 version（例如 s70）可以同时拥有 ankle/arm/waist 等多个子模块映射。
# - token 是子模块内部稳定键（例如 ankle 的 5gen_2/7gen；arm 的 parallellineararmsolver）。
# - config_dir/params_yaml/spec_yaml 是该模块的配置入口（相对 kuavo_solver 根目录）。
# - ankle 的 token 与 src/kuavo_assets/config/kuavo_vNN/kuavo.json 的 ankle_solver_type 对齐；
#   并联偏轴严格 Jacobian 仅当 axisoffsetanklesolver.yaml 含同名 variant（当前 5gen_2/s2gen_2/7gen）。
#
# 该文件由脚本按 kuavo.json 批量补全版本号别名；新增机型时请同步 kuavo.json 与本索引。

